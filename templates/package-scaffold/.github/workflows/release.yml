name: Build __PKG_NAME__ for Debian

on:
  schedule:
    # Auto-watch upstream every 3 hours and build new releases.
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: The version of __GITHUB_REPO__ to build (e.g. v1.0.0)
        type: string
        required: false
      build_version:
        description: Debian build revision (e.g. 1)
        type: string
        required: true
        default: '1'
      auto:
        description: 'Auto-detect the latest upstream release'
        type: boolean
        default: true
      architecture:
        description: Architecture to build (or 'all')
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'amd64'
          - 'arm64'
          - 'armel'
          - 'armhf'
          - 'ppc64el'
          - 's390x'
          - 'riscv64'
      enable_lintian:
        description: Enable lintian validation
        type: boolean
        default: true
      release_mode:
        description: 'auto publishes immediately after lintian + smoke test; draft keeps the GitHub draft for manual review'
        type: choice
        default: 'auto'
        options:
          - 'auto'
          - 'draft'

permissions:
  contents: write

jobs:
  prepare:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      build_version: ${{ steps.detect.outputs.build_version }}
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect version
        id: detect
        run: bash .github/scripts/detect-version.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_VERSION: ${{ inputs.version }}
          BUILD_VERSION: ${{ inputs.build_version }}
          AUTO: ${{ github.event_name == 'schedule' || inputs.auto }}

      - name: Recheck upstream license
        # License gate (warn-only): recheck the live upstream SPDX license
        # against the pin in package.yaml on every run, so a license change
        # upstream can't slip new builds through the auto-watch silently.
        id: license
        run: bash .github/scripts/license-check.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    # Native arm64 runner: arm64 is the Raspberry Pi audience's architecture
    # and the bulk of this channel's consumers. Building on arm64 hardware
    # (instead of cross-packaging on x64) is faster and validates arm64
    # natively; the builder packages every architecture either way.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache upstream downloads
        uses: actions/cache@v4
        with:
          path: /tmp/download_cache
          key: download-__PKG_NAME__-${{ needs.prepare.outputs.version }}
          restore-keys: download-__PKG_NAME__-

      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('package.yaml') }}
          restore-keys: apt-${{ runner.os }}-

      - name: Build __PKG_NAME__
        uses: ranjithrajv/debian-multiarch-builder@v.0.1a23
        env:
          # Authenticate GitHub API calls from the builder; anonymous calls
          # from shared runner IPs are rate-limited (60/h) and caused
          # architecture detection to find zero release assets.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-file: 'package.yaml'
          version: ${{ needs.prepare.outputs.version }}
          build-version: ${{ needs.prepare.outputs.build_version }}
          architecture: ${{ inputs.architecture }}
          lintian-check: ${{ inputs.enable_lintian }}
          # Provenance pin recorded at vet time (add-package.sh scaffold).
          # The builder verifies the downloaded upstream bytes against the
          # pinned SHA-256 when the release matches the vetted version, so a
          # release altered after vetting fails the build instead of being
          # silently packaged.
          pinned-metadata: ${{ github.workspace }}/.github/release-metadata.json

      - name: Upload builder summary on failure
        # The builder writes build-summary.json (structured failure data) on
        # both success and failure; persist it so the failure reporter can
        # fold it into the notification instead of anyone scraping logs.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-summary
          path: build-summary.json
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: __PKG_NAME__-debian-packages
          path: |
            __PKG_NAME___*.deb
            *.dsc
            *.debian.tar.xz
            *.orig.tar.xz
          if-no-files-found: error

  smoke:
    name: Smoke Test
    needs: [prepare, build]
    if: needs.build.result == 'success'
    # Runs the packaged arm64 binaries on native arm64 hardware (same
    # architecture as Raspberry Pi), so the smoke gate exercises exactly what
    # the Pi audience runs - no emulation, real runtime coverage.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: __PKG_NAME__-debian-packages

      - name: Run binaries from the built package
        run: |
          set -euo pipefail
          # Smoke-test the oldest available suite (bullseye first, then
          # bookworm, trixie, forky, sid) so packages that intentionally skip
          # a suite (e.g. atuin requiring a newer glibc than bookworm ships)
          # still get runtime coverage on the oldest suite they do build.
          #
          # This list is a copy: it runs in this repo's own isolated CI, with
          # no access to apt-repo's filesystem, so it can't read
          # apt-repo/suites.json (the canonical source) directly. Update
          # suites.json first, then run apt-repo's rollout-autowatch.sh to
          # fan this template out to every *-debian repo in one pass, rather
          # than hand-editing this list here or in any generated copy.
          DEB="" SUITE=""
          for suite in bullseye bookworm trixie forky sid; do
            mapfile -t debs < <(compgen -G "__PKG_NAME___*+${suite}_arm64.deb")
            if [ -n "${debs[0]:-}" ]; then
              DEB="${debs[0]}"
              SUITE="$suite"
              break
            fi
          done
          if [ -z "$DEB" ]; then
            echo "::notice::No arm64 package available to smoke test; skipping"
            exit 0
          fi
          EXPECTED="${{ needs.prepare.outputs.version }}"
          # Some upstreams (e.g. oven-sh/bun) tag releases as
          # "<pkgname>-vX.Y.Z" instead of plain "vX.Y.Z" - strip that prefix
          # before the leading v, or EXPECTED stays "bun-v1.4.0" while the
          # binary's actual --version output is just "1.4.0" and the grep
          # below never matches.
          EXPECTED="${EXPECTED#__PKG_NAME__-}"
          EXPECTED="${EXPECTED#v}"
          rm -rf smoke-root
          dpkg-deb -x "$DEB" smoke-root
          mapfile -t bin_names < <(basename -a smoke-root/usr/bin/*)
          # Actually install the .deb (not just extract + mount usr/bin) so
          # this exercises what a real `apt install` does: bundle-mode
          # packages symlink /usr/bin/<name> to an ABSOLUTE path under
          # /usr/lib/<package>/ (e.g. pnpm, zed), which only resolves once
          # the package is installed at its real root - mounting just
          # usr/bin left those as dangling symlinks. Installing also
          # exercises any Depends: the package declares (e.g. pnpm needs
          # libatomic1), catching a missing runtime dependency here instead
          # of shipping a package that crashes for every user.
          # shellcheck disable=SC2016 # intentionally unexpanded here - this
          # string is handed to a nested `bash -c` invocation below, which
          # is what expands $1/$name/$out/etc., not this outer shell.
          smoke_script='set -e
          apt-get update -qq
          apt-get install -y -qq "$1" >/dev/null
          shift; expected="$1"; shift
          for name in "$@"; do
            ok=0
            for arg in --version -V version; do
              out="$("$name" "$arg" 2>&1 || true)"
              if [ -n "$out" ] && printf "%s" "$out" | grep -q "$expected"; then
                echo "  OK: $name $arg -> $(printf "%s" "$out" | head -1)"
                ok=1
                break
              fi
            done
            [ "$ok" = 1 ] || { echo "SMOKE_FAIL:$name"; exit 1; }
          done
          echo "ALL_OK"'
          # The outer `set -e` would otherwise kill this script the instant
          # docker run exits non-zero - before $out ever gets echoed, losing
          # the actual diagnostic. Capture the exit status explicitly so a
          # real failure (SMOKE_FAIL, a crashed binary, apt-get install
          # itself failing) still prints what happened.
          #
          # ZED_ALLOW_ROOT: some binaries (zed) refuse to run as root as a
          # deliberate safety guard - harmless no-op for every package that
          # doesn't check for it, needed for the ones that do since this
          # container always runs as root.
          out="$(docker run --rm -e ZED_ALLOW_ROOT=true -v "$PWD/$DEB:/pkg.deb:ro" debian:$SUITE \
            bash -c "$smoke_script" _ /pkg.deb "$EXPECTED" "${bin_names[@]}" 2>&1)" || true
          echo "$out"
          if ! echo "$out" | grep -q "^ALL_OK$"; then
            echo "::error::Smoke test failed on $SUITE (expected version $EXPECTED)"
            exit 1
          fi
          echo "All binaries passed the smoke test"

  release:
    name: Release
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.smoke.result == 'success'
    needs: [prepare, build, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: __PKG_NAME__-debian-packages

      - name: Gate duplicate release tags
        # Refuse to (re)publish a release tag that already exists - published
        # or draft - so a retry or double-dispatch can't clobber or fork it.
        id: dup-gate
        run: |
          TAG="${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_version }}"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id' >/dev/null 2>&1; then
            echo "::warning::Release tag $TAG already exists (published or draft); skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        if: steps.dup-gate.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ inputs.release_mode == 'draft' }}
          tag_name: ${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_version }}
          name: ${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_version }}
          files: |
            __PKG_NAME___*.deb
            *.dsc
            *.debian.tar.xz
            *.orig.tar.xz
          fail_on_unmatched_files: true