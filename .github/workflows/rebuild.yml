name: Rebuild apt repository

on:
  # Primary trigger: a *-debian repo fires this via repository_dispatch the
  # moment a release is published (see notify-apt-repo.yml in the template).
  repository_dispatch:
    types: [release-published]
  # Fallback: guaranteed catch-up if a webhook is lost, the TRIGGER_TOKEN is
  # missing on a repo, or GitHub defers scheduled/dispatch events.
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours at :17
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: pages
  # Queue, don't cancel: a webhook-triggered rebuild that gets superseded a
  # minute before its gh-pages deploy could leave a half-pushed index.
  cancel-in-progress: false

jobs:
  # Coalesce webhook bursts: several *-debian repos can publish releases
  # within seconds of each other, each firing a repository_dispatch. Allow
  # at most one rebuild per 10-minute window so a release stampede doesn't
  # turn into a queue of full rebuilds (each re-downloads every tool). Every
  # rebuild is full-state, so a skipped trigger's release is picked up by the
  # next rebuild after the window - the 6h schedule is the final backstop.
  # Schedule and manual runs are never skipped (they reset the window).
  debounce:
    name: Debounce (min 10 min between rebuilds)
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Gate webhook triggers on a 10-minute minimum interval
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          skip=false
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            now="$(date +%s)"
            last="$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/rebuild.yml/runs?branch=${GITHUB_REF_NAME}&per_page=20" \
                --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .run_started_at] | max // empty" \
                2>/dev/null || true)"
            if [ -n "$last" ]; then
              if last_epoch="$(date -d "$last" +%s 2>/dev/null)"; then
                age="$(( now - last_epoch ))"
                if [ "$age" -lt 600 ]; then
                  skip=true
                  echo "::notice::A rebuild started ${age}s ago (<10 min); skipping this webhook trigger to avoid a burst of concurrent rebuilds."
                fi
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: debounce
    if: needs.debounce.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Log trigger
        # client_payload comes from another repo's release event (tag names
        # are attacker-influenceable if that repo's release process ever
        # takes external input) - pass via env rather than interpolating
        # into the script, consistent with package-request.yml's fix.
        run: |
          case "$EVENT_NAME" in
            repository_dispatch)
              echo "Triggered by release-published from $DISPATCH_REPO @ $DISPATCH_TAG"
              ;;
            schedule) echo "Triggered by schedule (fallback)" ;;
            workflow_dispatch) echo "Triggered manually" ;;
          esac
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq dpkg-dev apt-utils gnupg python3-yaml

      - name: Restore pool/ cache
        # Lets build-repo.sh skip re-downloading any tool whose latest tag
        # hasn't changed since the last run, instead of re-fetching the
        # whole ~750-asset catalog every single time regardless of whether
        # anything actually changed. restore-keys falls back to the most
        # recent cache under the prefix; a cold cache (first run, or after
        # eviction) just means every tool gets fetched fresh, same as
        # today - this can't make a run behave worse than the status quo.
        uses: actions/cache/restore@v4
        with:
          path: |
            pool
            .build-state
          key: pool-${{ github.run_id }}
          restore-keys: |
            pool-

      - name: Regenerate repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build-repo.sh

      - name: Save pool/ cache
        # Always saves under a fresh, unique key (github.run_id) so the
        # next run's restore-keys prefix match picks up this run's state.
        # Only runs if Regenerate repository succeeded (default step
        # behavior - no explicit `if:` needed), so a failed run never
        # caches a broken pool/.
        uses: actions/cache/save@v4
        with:
          path: |
            pool
            .build-state
          key: pool-${{ github.run_id }}

      - name: Snapshot Debian archive versions
        run: bash scripts/fetch-debian-versions.sh

      - name: Snapshot per-package license declarations
        run: bash scripts/fetch-licenses.sh

      - name: Sync package table in README from tools.yaml
        run: bash scripts/sync-readme.sh

      - name: Close the loop on published package requests
        # Tools whose tag changed this run get their originating
        # package-request issue commented on and closed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/close-request-loop.sh

      - name: Sign repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_PASS: ${{ secrets.APT_SIGNING_KEY_PASS }}
        run: bash scripts/sign-repo.sh

      - name: Deploy to gh-pages
        # Replaces the peaceiris action: pushes were dying mid-RPC with
        # HTTP 500 on the 1.5-2GB payload. deploy-gh-pages.sh forces
        # HTTP/1.1, commits on top of existing history (blob dedupe), and
        # retries the whole cycle 3x with backoff.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy-gh-pages.sh

      - name: Report a broken rebuild
        # A failed webhook-triggered rebuild still has the 6h schedule as a
        # backstop, but a failed *scheduled* rebuild has nothing behind it
        # except tomorrow's staleness watchdog (up to 48h later). Surface it
        # immediately instead of waiting for that grace window to expire.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/report-workflow-failure.sh "Rebuild apt repository"
