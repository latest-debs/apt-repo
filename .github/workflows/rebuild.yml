name: Rebuild apt repository

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours at :17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq dpkg-dev apt-utils gnupg

      - name: Regenerate repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build-repo.sh

      - name: Snapshot Debian archive versions
        run: bash scripts/fetch-debian-versions.sh

      - name: Sign repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_PASS: ${{ secrets.APT_SIGNING_KEY_PASS }}
        run: bash scripts/sign-repo.sh

      - name: Unignore generated pool/dists for the Pages publish
        # .gitignore keeps pool/ and dists/ (build artifacts) out of the
        # main branch's history, but peaceiris/actions-gh-pages publishes
        # this same working directory verbatim - so the same .gitignore
        # was silently excluding them from every gh-pages deploy, meaning
        # the site never actually served any packages.
        run: rm -f .gitignore

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
