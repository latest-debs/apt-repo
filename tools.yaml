  homepage: https://github.com/junegunn/fzf

starship:
  source: https://github.com/latest-debs/starship-debian
  homepage: https://github.com/starship/starship

just:
  source: https://github.com/latest-debs/just-debian
  homepage: https://github.com/casey/just

hyperfine:
  source: https://github.com/latest-debs/hyperfine-debian
  homepage: https://github.com/sharkdp/hyperfine

k9s:
  source: https://github.com/latest-debs/k9s-debian
  homepage: https://github.com/derailed/k9s

atuin:
  source: https://github.com/latest-debs/atuin-debian
  homepage: https://github.com/atuinsh/atuin

xh:
  source: https://github.com/latest-debs/xh-debian
  homepage: https://github.com/ducaale/xh

yq-go:
  source: https://github.com/latest-debs/yq-debian
  homepage: https://github.com/mikefarah/yq
  # Debian's own "yq" package is an unrelated, older Python-based tool
  # (kislyuk/yq); this one is packaged there under no equivalent name, so
  # no debian_name override - it should correctly show as "not packaged".

du-dust:
  source: https://github.com/latest-debs/du-dust-debian
  homepage: https://github.com/bootandy/dust

procs:
