---
# extrepo metadata for the latest-debs aggregate repository.
#
# This file is intended to be contributed upstream to
# https://salsa.debian.org/extrepo-team/extrepo-data as
# repos/debian/latest-debs.yaml so that users can run:
#
#     sudo extrepo enable latest-debs
#
# See https://salsa.debian.org/extrepo-team/extrepo-data for the full
# metadata format and the rules external repositories must follow.

latest-debs:
  description: Latest stable releases of developer tools, packaged for Debian and Ubuntu. Tracks uv, eza, lazygit and more.
  source:
    Types: deb
    URIs: https://latest-debs.github.io/apt-repo/
    Suites: <SUITE>
    Components: main
    # Architectures are the union per suite, verified against each suite's
    # real dists/*/Release Architectures field - re-check there before
    # editing, since which tools publish which archs changes over time.
    Architectures: amd64 arm64 armhf armel i386 loong64 ppc64el riscv64 s390x
    # Ubuntu suites are aliases of Debian suites (same .debs, glibc-checked);
    # their arch sets match the source suite exactly (verified 2026-08-27):
    #   jammy -> bullseye, noble/questing/resolute -> trixie
    suite-jammy-Architectures: amd64 arm64 armhf ppc64el riscv64 s390x i386 loong64
    suite-noble-Architectures: amd64 arm64 armhf armel i386 loong64 ppc64el riscv64 s390x
    suite-questing-Architectures: amd64 arm64 armhf armel i386 loong64 ppc64el riscv64 s390x
    suite-resolute-Architectures: amd64 arm64 armhf armel i386 loong64 ppc64el riscv64 s390x
    suite-forky-Architectures: amd64 arm64 armhf loong64 ppc64el riscv64 s390x
    suite-sid-Architectures: amd64 arm64 armhf loong64 ppc64el riscv64 s390x
  suites:
    - bookworm
    - trixie
    - forky
    - sid
    - jammy
    - noble
    - questing
    - resolute
  policy: main
  contact: latest-debs@users.noreply.github.com
  bugs: https://github.com/latest-debs/apt-repo/issues
