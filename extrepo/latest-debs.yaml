---
# extrepo metadata for the latest-debs aggregate repository.
#
# This file is intended to be contributed upstream to
# https://salsa.debian.org/extrepo-team/extrepo-data as
# repos/debian/latest-debs.yaml so that users can run:
#
#     sudo extrepo enable latest-debs
#
# See https://salsa.debian.org/extrepo-team/extrepo-data for the full
# metadata format and the rules external repositories must follow.

latest-debs:
  description: Latest stable releases of developer tools, packaged for Debian. Tracks uv, eza, lazygit and more.
  source:
    Types: deb
    URIs: https://latest-debs.github.io/apt-repo/
    Suites: <SUITE>
    Components: main
    # i386 and armel are bookworm/trixie only - riscv64 support requirements
    # dropped i386 from forky/sid, and no currently-tracked package builds a
    # soft-float ARM target for forky/sid. loong64 is covered in all four
    # suites. Verified directly against each suite's real dists/*/Release
    # Architectures field, not assumed - re-check there before editing this
    # again, since which tools publish which archs changes over time.
    Architectures: amd64 arm64 armhf i386 armel loong64 ppc64el riscv64 s390x
    suite-forky-Architectures: amd64 arm64 armhf loong64 ppc64el riscv64 s390x
    suite-sid-Architectures: amd64 arm64 armhf loong64 ppc64el riscv64 s390x
  suites:
    - bookworm
    - trixie
    - forky
    - sid
  policy: main
  contact: latest-debs@users.noreply.github.com
  bugs: https://github.com/latest-debs/apt-repo/issues
